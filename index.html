<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TFG Systemd vs Kubernetes</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* VARIABLES DE TEMA */
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --sidebar-bg: #f5f5f5;
    }

    body.dark-mode {
      --bg-color: #1e1e1e;
      --text-color: #d4d4d4;
      --sidebar-bg: #252526;
    }

    /* APLICACIÓN DE VARIABLES */
    body {
      background-color: var(--bg-color) !important;
      color: var(--text-color) !important;
      transition: background-color 0.3s, color 0.3s;
    }
    
    .sidebar { background-color: var(--sidebar-bg) !important; }
    
    /* Ajustes para textos y enlaces en modo oscuro */
    body.dark-mode .markdown-section h1, 
    body.dark-mode .markdown-section h2, 
    body.dark-mode .markdown-section h3 { color: #ffffff !important; }
    
    body.dark-mode .markdown-section a { color: #60a5fa !important; }

    /* ESTILOS DEL BOTÓN */
    #theme-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      padding: 10px 15px;
      border-radius: 20px;
      border: 1px solid #ccc;
      background: #f0f0f0;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    body.dark-mode #theme-toggle { background: #333; color: white; border: none; }

    /* TU CSS ORIGINAL (Ocultar submenús, etc.) */
    .sidebar-nav li > ul { display: none; }
    .sidebar-nav li.active > ul { display: block; }
    .sidebar-nav > ul > li > a { position: relative; padding-left: 1.5em; }
    .sidebar-nav > ul > li > a:before { content: "▶"; position: absolute; left: 0; font-size: 0.7em; transition: transform 0.2s; }
    .sidebar-nav > ul > li.active > a:before { transform: rotate(90deg); }

    /* VARIABLES DE TEMA */
  :root {
    --bg-color: #ffffff;
    --text-color: #333333;
    --sidebar-bg: #f5f5f5;
  }

  body.dark-mode {
    --bg-color: #1e1e1e;
    --text-color: #d4d4d4;
    --sidebar-bg: #252526;
  }

  /* APLICACIÓN DE VARIABLES */
  body {
    background-color: var(--bg-color) !important;
    color: var(--text-color) !important;
    transition: background-color 0.3s, color 0.3s;
  }
  
  .sidebar { background-color: var(--sidebar-bg) !important; }
  
  /* --- FORZAR COLORES EN MODO OSCURO --- */
  body.dark-mode h1, 
  body.dark-mode h2, 
  body.dark-mode h3, 
  body.dark-mode h4, 
  body.dark-mode h5, 
  body.dark-mode h6,
  body.dark-mode strong,
  body.dark-mode .sidebar,
  body.dark-mode .sidebar a {
    color: #ffffff !important; /* Blanco puro para máxima legibilidad */
  }

  body.dark-mode p,
  body.dark-mode li {
    color: #d4d4d4 !important; /* Gris claro para el texto de párrafos */
  }

  body.dark-mode a {
    color: #60a5fa !important; /* Azul neón para los enlaces */
  }

  body.dark-mode code {
    background-color: #333 !important;
    color: #ff79c6 !important; /* Color rosado para código que resalte en oscuro */
  }
  /* ------------------------------------- */
  </style>
</head>

<body>
  <button id="theme-toggle">🌙 Cambiar Tema</button>
  <div id="app"></div>

  <script>
    window.$docsify = {
      loadSidebar: true,
      auto2top: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      name: 'TFG Systemd vs Kubernetes',
      repo: 'https://github.com/xji650/tfg-systemd-kubernetes'
    }

    // LÓGICA DEL BOTÓN
    const toggleButton = document.getElementById('theme-toggle');
    toggleButton.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      toggleButton.innerText = isDark ? '☀️ Cambiar Tema' : '🌙 Cambiar Tema';
    });

    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      toggleButton.innerText = '☀️ Cambiar Tema';
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//unpkg.com/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="//unpkg.com/docsify-mermaid/dist/docsify-mermaid.min.js"></script>
  <script>
    if (window.mermaid) { mermaid.initialize({ startOnLoad: true }); }
  </script>
</body>
</html>
