---
- name: Limpieza total de Infraestructura MNIST
  hosts: all
  tasks:
    - name: Detener servicios de usuario
      systemd:
        name: "{{ item }}"
        scope: user
        state: stopped
        enabled: no
      loop:
        - worker.service
        - red-network.service
      ignore_errors: yes

    - name: Eliminar archivos Quadlet y configuraciones
      file:
        path: "{{ ansible_env.HOME }}/.config/containers/systemd/{{ item }}"
        state: absent
      loop:
        - worker.container
        - red.network
      ignore_errors: yes

    - name: Eliminar artefacto .tar en el worker
      file:
        path: "{{ ansible_env.HOME }}/worker-mnist.tar"
        state: absent
      ignore_errors: yes

    - name: Eliminar artefacto .tar en el master
      delegate_to: localhost
      run_once: true
      file:
        path: "/tmp/worker-mnist.tar"
        state: absent
      ignore_errors: yes

    - name: Recargar systemd de usuario
      systemd:
        scope: user
        daemon_reload: yes

    - name: Forzar borrado de contenedores, redes e imágenes
      shell: |
        # Usamos el nombre exacto que define tu worker.container.j2
        podman rm -f worker-mnist-{{ inventory_hostname }} || true
        # Nota: La red se llama 'red' porque en tu red.network pusiste 'Name=red'
        podman network rm red || true
        podman rmi localhost/worker-mnist:v1 || true
      ignore_errors: yes

    - name: Limpiar estados de unidades fallidas
      command: "systemctl --user reset-failed"
      ignore_errors: yes